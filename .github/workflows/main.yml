name: Sync with upstream Raspberry Pi Linux

on:
  schedule:
    - cron: '0 2 * * *'  # täglich 02:00 UTC
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: rpi
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/raspberrypi/linux.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout rpi
          git merge upstream/rpi --ff-only || echo "No fast-forward possible"

      - name: Push changes
        run: git push origin rpi
