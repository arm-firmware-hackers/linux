name: Sync Upstream Repo (raspberrypi/linux)

#on:
  #schedule:
   # - cron: '0 3 * * *'  # Täglich um 03:00 UTC
  #workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHP_1WBO6OIDMXGRVHKR6PIRZHFUDYUK7Y1DQ7Z9 }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/raspberrypi/linux.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout master
          git merge upstream/master --no-edit || true

      - name: Push changes to origin
        run: |
          git push origin master
